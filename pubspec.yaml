name: mymasya_ai
description: MyMasyaAI — deep virtual AI companion (Talking Tom-class UX, growth 4–60+).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  collection: ^1.19.1
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6

  # UI / motion
  google_fonts: ^6.2.1
  rive: ^0.13.20
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.5
  confetti: ^0.8.0

  # Device / network
  connectivity_plus: ^6.1.4
  sensors_plus: ^6.1.1
  http: ^1.3.0
  dio: ^5.8.0+1
  camera: ^0.11.1
  image_picker: ^1.1.2
  file_picker: ^9.2.1
  permission_handler: ^11.4.0
  geolocator: ^13.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/rive/
    - assets/images/
    - assets/images/character/
    - assets/images/rooms/
    - assets/sounds/
    - assets/i18n/
    - assets/models/
