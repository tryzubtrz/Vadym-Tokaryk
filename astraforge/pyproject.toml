[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astraforge"
version = "1.0.0"
description = "AstraForge AI — autonomous crypto perpetual futures trading agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AstraForge" }]
dependencies = [
    "ccxt>=4.4.0",
    "aiogram>=3.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
    "jinja2>=3.1.4",
    "apscheduler>=3.10.4",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
astraforge = "astraforge.main:main"
astraforge-bot = "astraforge.telegram.bot:main"
astraforge-dashboard = "astraforge.dashboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astraforge"]

[tool.hatch.build.targets.wheel.sources]
"src/astraforge" = "astraforge"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
